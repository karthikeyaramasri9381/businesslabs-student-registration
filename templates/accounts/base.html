{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Student Portal
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body>

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a
                class="navbar-brand"
                href="{% url 'home' %}"
            >
                Student Portal
            </a>

            <div>

                {% if request.session.student_id %}

                    <a
                        href="{% url 'student_dashboard' %}"
                        class="btn btn-light btn-sm me-2"
                    >
                        Dashboard
                    </a>

                    <a
                        href="{% url 'logout' %}"
                        class="btn btn-outline-light btn-sm"
                    >
                        Logout
                    </a>

                {% elif request.session.admin_id %}

                    <a
                        href="{% url 'admin_dashboard' %}"
                        class="btn btn-light btn-sm me-2"
                    >
                        Dashboard
                    </a>

                    <a
                        href="{% url 'logout' %}"
                        class="btn btn-outline-light btn-sm"
                    >
                        Logout
                    </a>

                {% else %}

                    <a
                        href="{% url 'login' %}"
                        class="btn btn-light btn-sm me-2"
                    >
                        Login
                    </a>

                    <a
                        href="{% url 'signup' %}"
                        class="btn btn-outline-light btn-sm"
                    >
                        Register
                    </a>

                {% endif %}

            </div>

        </div>

    </nav>

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <footer class="text-center mt-5 py-3">

        <p class="mb-0">
            Student Portal
        </p>

    </footer>

</body>

</html>
